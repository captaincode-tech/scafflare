[workspace]
resolver = "2"
members = [
  "crates/scafflare-core",
  "crates/scafflare-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Captain Code"]
repository = "https://github.com/captaincode-tech/scafflare"
homepage = "https://github.com/captaincode-tech/scafflare"
readme = "README.md"
keywords = ["scaffolding", "cli", "code-generation", "templates", "recipes"]
categories = ["command-line-utilities", "development-tools", "template-engine"]

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
clap = { version = "4.5", features = ["derive", "color"] }
console = "0.15"
dialoguer = "0.11"
dirs = "5.0"
include_dir = "0.7"
minijinja = { version = "2.1", features = ["builtins"] }
predicates = "3.1"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
tempfile = "3.10"
thiserror = "1.0"
walkdir = "2.5"
