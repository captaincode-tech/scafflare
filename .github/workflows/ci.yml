name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: scafflare-${{ runner.os }}
          path: target/release/scafflare*
          if-no-files-found: error

  recipe-validation:
    name: Validate official recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate recipes
        shell: bash
        run: |
          for recipe in recipes/official/*; do
            cargo run -q -p scafflare -- recipe validate "$recipe/recipe.yaml" --quiet
          done

  fixture-matrix:
    name: Generate and validate supported fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Generate, install, audit, typecheck, lint, test, and build fixtures
        shell: bash
        run: scripts/verify-fixtures.sh
