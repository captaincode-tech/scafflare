name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
        env:
          PROPTEST_CASES: '1024'
      - name: Release build
        run: cargo build --workspace --release
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: scafflare-${{ runner.os }}
          path: target/release/scafflare*
          if-no-files-found: error

  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: Build and test on the minimum supported Rust version
        run: cargo test --workspace --locked

  recipe-validation:
    name: Validate official recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate recipes
        shell: bash
        run: |
          for recipe in recipes/official/*/; do
            cargo run -q -p scafflare -- recipe validate "${recipe}recipe.yaml" --quiet
          done

  fixture-matrix:
    name: Generate and validate supported fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm
        run: npm install -g npm@latest
      - name: Generate, install, audit, typecheck, lint, test, and build fixtures
        shell: bash
        run: scripts/verify-fixtures.sh

  upgrade-fixture:
    name: Upgrade legacy projects with real npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm
        run: npm install -g npm@latest
      - name: Generate legacy projects, upgrade them, then install, typecheck, lint, test, and build
        shell: bash
        run: scripts/verify-upgrade.sh
