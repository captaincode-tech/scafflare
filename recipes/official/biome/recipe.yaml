schema_version: 1
metadata:
  name: biome
  version: 0.1.0
  description: Biome linting and formatting configuration
  activation_variables:
    biome_enabled: true
depends_on:
  - typescript
compatible_with: []
conflicts: []
required_capabilities: []
files:
  - source: templates/package.fragment.json.jinja
    destination: package.json
    strategy: merge_json
  - source: templates/biome.json.jinja
    destination: biome.json
    strategy: create
validation_commands:
  - [npm, run, lint]
post_generation_instructions: []
